<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" width="720" height="276" role="img" aria-labelledby="t d">
<title id="t">全体の構成（例）</title><desc id="d">負荷生成ツールが API A と API B に同じ要求を送り、両方が同じデータベースを引く。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .grid { stroke: #e6e5e1; stroke-width: 1; } .axis { stroke: #c9c8c3; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c9c8c3; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e6e5e1; stroke-width: 1; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .head { fill: #52514e; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .onfill { fill: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .grid { stroke: #2e2e2c; } .axis { stroke: #4a4a46; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2e2e2c; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
  }
</style>
<rect class="bg" width="720" height="276"/>
<rect class="grp" x="16" y="56" width="188" height="128" rx="8"/><text x="26" y="74" class="ink2" font-size="11" text-anchor="start" font-weight="600">負荷生成</text><rect class="box" x="32" y="84" width="156" height="76" rx="6"/><text x="110" y="118" class="ink" font-size="12" text-anchor="middle" font-weight="600">負荷生成ツール</text><text x="110" y="134" class="ink2" font-size="11" text-anchor="middle" font-weight="400">同じ要求を A と B に送る</text><rect class="grp" x="252" y="20" width="224" height="100" rx="8"/><text x="262" y="38" class="ink2" font-size="11" text-anchor="start" font-weight="600">実装 A</text><rect class="k1" x="268" y="44" width="192" height="62" rx="6"/><text x="364" y="71" class="ink" font-size="12" text-anchor="middle" font-weight="600">API A</text><text x="364" y="87" class="ink2" font-size="11" text-anchor="middle" font-weight="400">要求ごとに DB を引く</text><rect class="grp" x="252" y="128" width="224" height="100" rx="8"/><text x="262" y="146" class="ink2" font-size="11" text-anchor="start" font-weight="600">実装 B</text><rect class="k2" x="268" y="152" width="192" height="62" rx="6"/><text x="364" y="179" class="ink" font-size="12" text-anchor="middle" font-weight="600">API B</text><text x="364" y="195" class="ink2" font-size="11" text-anchor="middle" font-weight="400">結果をキャッシュする</text><rect class="grp" x="520" y="56" width="184" height="128" rx="8"/><text x="530" y="74" class="ink2" font-size="11" text-anchor="start" font-weight="600">共通</text><rect class="box" x="536" y="84" width="152" height="76" rx="6"/><text x="612" y="118" class="ink" font-size="12" text-anchor="middle" font-weight="600">データベース</text><text x="612" y="134" class="ink2" font-size="11" text-anchor="middle" font-weight="400">A と B で同じもの</text><polyline class="line" points="188,112 220,112 220,75 268,75"/><polygon class="head" points="268,75 260.6,71.9 260.6,78.1"/><polyline class="line" points="188,132 220,132 220,183 268,183"/><polygon class="head" points="268,183 260.6,179.9 260.6,186.1"/><polyline class="line" points="460,75 492,75 492,112 536,112"/><polygon class="head" points="536,112 528.6,108.9 528.6,115.1"/><polyline class="line" points="460,183 492,183 492,132 536,132"/><polygon class="head" points="536,132 528.6,128.9 528.6,135.1"/><text x="16" y="262" class="ink2" font-size="11" text-anchor="start" font-weight="400">矢印は、要求の向き。A と B は同じ DB を引く。</text>
</svg>
