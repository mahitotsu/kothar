# 作業プロセスのモデル。段階、成果物の種類、役割、決まりと道具のつながりだけを書く。
# 個々の要件や仕様の項目は書かない（それらの対応は scripts/trace.ts が出す）。

vocabulary: vocabulary.yaml
grammar: grammar.yaml

nodes:
  # 段階
  - { id: s1, label: 1. 約束, attrs: { element: stage } }
  - { id: s2, label: 2. 体験, attrs: { element: stage } }
  - { id: s3, label: 3. 要件, attrs: { element: stage } }
  - { id: s4, label: 4. 仕様の仮説, attrs: { element: stage } }
  - { id: s5, label: 5. 収束, attrs: { element: stage } }
  - { id: s6, label: 6. ゲート, attrs: { element: stage } }
  # 役割
  - { id: owner, label: 責任者, attrs: { element: role } }
  # 収束のループの作業
  - { id: write-adr, label: ADR を書く, attrs: { element: activity } }
  - { id: run-spike, label: 検証する, attrs: { element: activity } }
  - { id: implement, label: 実装しテストを書く, attrs: { element: activity } }
  # 成果物の種類
  - { id: prfaq, label: PR/FAQ, attrs: { element: artifact, doc: promise } }
  - { id: experience, label: 体験, attrs: { element: artifact, doc: experience } }
  - { id: requirements, label: 要件, attrs: { element: artifact, doc: requirement } }
  - { id: spec, label: 仕様, attrs: { element: artifact, doc: specification } }
  - { id: adr, label: ADR, attrs: { element: artifact, doc: record } }
  - { id: report, label: 検証の報告書, attrs: { element: artifact, doc: record } }
  - { id: gate, label: ゲートの記録, attrs: { element: artifact, doc: record } }
  - { id: tests, label: テスト, attrs: { element: artifact, doc: test } }
  # 参照する決まりと道具
  - { id: doc-system, label: 文書体系, attrs: { element: reference } }
  - { id: todo, label: 作業項目の一覧, attrs: { element: reference } }
  - { id: trace, label: 対応表, attrs: { element: reference } }

groups:
  - { id: cycle, label: サイクル, members: [promise-loop, converge-loop, s6] }
  - { id: promise-loop, label: 約束のループ, attrs: { loop: promise }, members: [s1, s2, s3] }
  - { id: converge-loop, label: 収束のループ, attrs: { loop: converge }, members: [s4, s5, write-adr, run-spike, implement] }

edges:
  # 段階の流れ
  - { from: s1, to: s2, kind: next }
  - { from: s2, to: s3, kind: next }
  - { from: s3, to: s4, kind: next }
  - { from: s4, to: s5, kind: next }
  - { from: s5, to: s6, kind: next }
  # 承認（段階4は承認が要らない）
  - { from: s1, to: owner, kind: approve }
  - { from: s2, to: owner, kind: approve }
  - { from: s3, to: owner, kind: approve }
  - { from: s5, to: owner, kind: approve, label: ADR ごと }
  - { from: s6, to: owner, kind: approve, label: 判定 }
  # 収束のループ
  - { from: s5, to: write-adr, kind: do }
  - { from: s5, to: run-spike, kind: do }
  - { from: s5, to: implement, kind: do }
  # 上流に戻る
  - { from: s5, to: s4, kind: back, label: 仕様を書き直す }
  - { from: s5, to: s3, kind: back, label: 要件を変える }
  - { from: s6, to: s1, kind: back, label: 次のサイクル }
  # 決まりと道具
  - { from: cycle, to: doc-system, kind: refer }
  - { from: cycle, to: todo, kind: refer }
  - { from: cycle, to: trace, kind: refer }
  # 成果物を作る
  - { from: s1, to: prfaq, kind: produce }
  - { from: s2, to: experience, kind: produce }
  - { from: s3, to: requirements, kind: produce }
  - { from: s4, to: spec, kind: produce }
  - { from: write-adr, to: adr, kind: produce }
  - { from: run-spike, to: report, kind: produce }
  - { from: implement, to: tests, kind: produce }
  - { from: s6, to: gate, kind: produce }
  # 成果物のつながり
  - { from: prfaq, to: experience, kind: derive }
  - { from: experience, to: requirements, kind: derive }
  - { from: requirements, to: spec, kind: derive }
  - { from: adr, to: spec, kind: ground }
  - { from: report, to: adr, kind: ground }
  - { from: gate, to: prfaq, kind: ground, label: 見直す }
  - { from: tests, to: requirements, kind: verify }
