# 作業プロセスの語彙。docs/process.md と docs/README.md に書いた作業プロセスと文書体系の骨組みを表す。

attributes:
  element: [stage, activity, artifact, reference, role]  # 要素の種類
  doc: [promise, experience, requirement, specification, record, test]  # 成果物の種類（element: artifact に付ける）
  loop: [promise, converge]  # ループの種類（グループに付ける）

edgeKinds:
  - next      # 次の段階へ進む
  - approve   # 責任者が承認する
  - do        # 段階の中で行う
  - back      # 上流に戻る
  - refer     # 決まりや道具を参照する
  - produce   # 成果物を作る
  - derive    # 上流の成果物から導く
  - ground    # 判断の根拠になる
  - verify    # 要件を検証する
