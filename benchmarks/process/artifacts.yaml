# 成果物のつながりの図の文法。PR/FAQ から体験、要件、仕様へ導くつながりと、それを根拠づけ、検証する記録とテストを描く。
# 説明と、この文法から期待する不変条件は artifacts.md にある。

vocabulary: vocabulary.yaml

flow: right

regions:
  - { name: promise, place: column, column: 0, when: { doc: promise } }
  - { name: experience, place: column, column: 1, when: { doc: experience } }
  - { name: requirement, place: column, column: 2, when: { doc: requirement } }
  - { name: specification, place: column, column: 3, when: { doc: specification } }
  - { name: record, place: column, column: 4, when: { doc: record } }
  - { name: test, place: column, column: 4, when: { doc: test } }
  - { name: other, place: hidden }   # 段階、作業、役割、決まりと道具は、この図には出さない

styles:
  derive: { line: solid }
  ground: { line: dashed, color: "#6b7280" }
  verify: { line: dotted, color: "#b45309" }

edges:
  - { kind: derive, style: derive, exit: east, enter: west, flow: true }
  - { kind: ground, style: ground, exit: west, enter: east }
  - { kind: verify, style: verify, exit: west, enter: east }
  - { kind: next, hidden: true }
  - { kind: approve, hidden: true }
  - { kind: do, hidden: true }
  - { kind: back, hidden: true }
  - { kind: refer, hidden: true }
  - { kind: produce, hidden: true }
