# サイクルの図の文法。作業プロセスの段階の流れ、責任者の承認、収束のループ、上流に戻る線を描く。
# 説明と、この文法から期待する不変条件は grammar.md にある。

vocabulary: vocabulary.yaml

flow: right

regions:
  - name: artifact
    place: hidden           # 成果物は、この図には出さない（成果物のつながりの図に出す）
    when: { element: artifact }
  - name: reference
    place: side-column
    when: { element: reference }
    label: 参照する決まりと道具
  - name: approver
    place: above-caller
    when: { element: role }
    label: 承認
  - name: activity
    place: below-main
    when: { element: activity }
    label: 収束のループの作業
  - name: main
    place: main

styles:
  next: { line: solid }
  approve: { line: solid }
  do: { line: dashed }
  back: { line: dotted, color: "#b45309" }
  refer: { line: dotted, color: "#9ca3af", weight: thin }

edges:
  - { kind: approve, style: approve, exit: north, enter: south }
  - { kind: next, style: next, exit: east, enter: west, flow: true }
  - { kind: do, style: do, exit: south, enter: north }
  - { kind: back, style: back, exit: south, enter: south, route: around }
  - { kind: refer, style: refer, exit: east, enter: west }
  - { kind: produce, hidden: true }
  - { kind: derive, hidden: true }
  - { kind: ground, hidden: true }
  - { kind: verify, hidden: true }
