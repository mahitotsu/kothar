<g transform="translate(81,20)"><rect class="grp" x="218" y="0" width="166" height="209" rx="8"/><text x="228" y="18" class="ink2" font-size="11" text-anchor="start" font-weight="600">このシステムの境界</text><polyline class="line" points="156,50 232,50"/><polygon class="head" points="232,50 224.6,46.9 224.6,53.1"/><polyline class="line" points="301,76 301,135"/><polygon class="head" points="301,135 304.1,127.6 297.9,127.6"/><polyline class="line" points="370,50 446,50"/><polygon class="head" points="446,50 438.6,46.9 438.6,53.1"/><polyline class="line" points="370,50 408,50 408,165 446,165"/><polygon class="head" points="446,165 438.6,161.9 438.6,168.1"/><rect class="box" x="12" y="23" width="144" height="54" rx="6"/><text x="90" y="46" class="ink" font-size="12" text-anchor="middle" font-weight="600">利用者</text><text x="90" y="62" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ブラウザから注文する</text><circle class="ink2" cx="6" cy="44" r="4.5"/><path class="ink2" d="M-3,60 Q-3,51 6,51 Q15,51 15,60 Z"/><rect class="k1" x="232" y="24" width="138" height="52" rx="6"/><text x="301" y="46" class="ink" font-size="12" text-anchor="middle" font-weight="600">注文 API</text><text x="301" y="62" class="ink2" font-size="11" text-anchor="middle" font-weight="400">要求を受けて処理する</text><path class="box" d="M245,142 A56,7 0 0 1 357,142 L357,188 A56,7 0 0 1 245,188 Z"/><path class="box" d="M245,142 A56,7 0 0 0 357,142" fill="none"/><text x="301" y="164.5" class="ink" font-size="12" text-anchor="middle" font-weight="600">データベース</text><text x="301" y="180.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">注文の記録</text><rect class="box" x="446" y="24" width="112" height="52" rx="6"/><text x="502" y="46" class="ink" font-size="12" text-anchor="middle" font-weight="600">在庫システム</text><text x="502" y="62" class="ink2" font-size="11" text-anchor="middle" font-weight="400">外部。社内</text><rect class="box" x="446" y="139" width="112" height="52" rx="6"/><text x="502" y="161" class="ink" font-size="12" text-anchor="middle" font-weight="600">決済サービス</text><text x="502" y="177" class="ink2" font-size="11" text-anchor="middle" font-weight="400">外部。他社</text><rect class="bg" x="168" y="41.5" width="52" height="17"/><text x="194" y="53.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">注文する</text><rect class="bg" x="275" y="97" width="52" height="17"/><text x="301" y="109" class="ink2" font-size="11" text-anchor="middle" font-weight="400">記録する</text><rect class="bg" x="376.5" y="41.5" width="63" height="17"/><text x="408" y="53.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">在庫を引く</text><rect class="bg" x="360" y="99" width="96" height="17"/><text x="408" y="111" class="ink2" font-size="11" text-anchor="middle" font-weight="400">支払いを依頼する</text></g><text x="20" y="249" class="ink2" font-size="11" text-anchor="start" font-weight="400">矢印は、要求の向き。外部のシステムは、境界の外に置く。</text>
</svg>
