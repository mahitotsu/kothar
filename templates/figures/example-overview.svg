olyline class="line" points="460,75 492,75 492,112 536,112"/><polygon class="head" points="536,112 528.6,108.9 528.6,115.1"/><polyline class="line" points="460,183 492,183 492,132 536,132"/><polygon class="head" points="536,132 528.6,128.9 528.6,135.1"/><text x="16" y="262" class="ink2" font-size="11" text-anchor="start" font-weight="400">矢印は、要求の向き。A と B は同じ DB を引く。</text>
