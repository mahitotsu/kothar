<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img" aria-labelledby="t d">
<title id="t">キャッシュの追加（例）</title><desc id="d">変更前は、API が毎回データベースを引く。変更後は、API とデータベースの間にキャッシュを置き、先にキャッシュを引く。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="720" height="160"/>
<text x="20" y="30" class="ink" font-size="13" text-anchor="start" font-weight="600">変更前</text><text x="303.1" y="30" class="ink" font-size="13" text-anchor="start" font-weight="600">変更後</text><line class="axis" x1="283.5" x2="283.5" y1="20" y2="93.6"/><g transform="translate(20,48) scale(0.8)"><polyline class="line" points="112,28 188,28"/><polygon class="head" points="188,28 180.6,24.9 180.6,31.1"/><rect class="k1" x="0" y="2" width="112" height="52" rx="6"/><text x="56" y="24" class="ink" font-size="12" text-anchor="middle" font-weight="600">API</text><text x="56" y="40" class="ink2" font-size="11" text-anchor="middle" font-weight="400">毎回 DB を引く</text><path class="box" d="M188,7 A56,7 0 0 1 300,7 L300,49 A56,7 0 0 1 188,49 Z"/><path class="box" d="M188,7 A56,7 0 0 0 300,7" fill="none"/><text x="244" y="35.5" class="ink" font-size="12" text-anchor="middle" font-weight="600">DB</text><rect class="bg" x="135" y="19.5" width="30" height="17"/><text x="150" y="31.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">読む</text></g><g transform="translate(303.1,48) scale(0.8)"><polyline class="ladd" points="112,28 188,28"/><polygon class="hadd" points="188,28 180.6,24.9 180.6,31.1"/><polyline class="ladd" points="300,28 376,28"/><polygon class="hadd" points="376,28 368.6,24.9 368.6,31.1"/><polyline class="lrem" points="56,6 56,-25 432,-25 432,0"/><polygon class="hrem" points="432,0 435.1,-7.4 428.9,-7.4"/><rect class="k1" x="0" y="6" width="112" height="44" rx="6"/><text x="56" y="32" class="ink" font-size="12" text-anchor="middle" font-weight="600">API</text><rect class="kadd" x="188" y="2" width="112" height="52" rx="6"/><text x="244" y="24" class="ink" font-size="12" text-anchor="middle" font-weight="600">キャッシュ</text><text x="244" y="40" class="ink2" font-size="11" text-anchor="middle" font-weight="400">60 秒</text><circle class="hadd ring" cx="298" cy="4" r="9"/><polyline class="glyph" points="294,4 302,4"/><polyline class="glyph" points="298,0 298,8"/><path class="box" d="M376,7 A56,7 0 0 1 488,7 L488,49 A56,7 0 0 1 376,49 Z"/><path class="box" d="M376,7 A56,7 0 0 0 488,7" fill="none"/><text x="432" y="35.5" class="ink" font-size="12" text-anchor="middle" font-weight="600">DB</text><rect class="bg" x="124" y="19.5" width="52" height="17"/><text x="150" y="31.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">先に読む</text><rect class="bg" x="312" y="19.5" width="52" height="17"/><text x="338" y="31.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">なければ</text><rect class="bg" x="218" y="-33.5" width="52" height="17"/><text x="244" y="-21.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">直接読む</text></g><circle class="hadd ring" cx="28" cy="116.6" r="9"/><polyline class="glyph" points="24,116.6 32,116.6"/><polyline class="glyph" points="28,112.6 28,120.6"/><text x="44" y="120.6" class="ink" font-size="12" text-anchor="start" font-weight="400">追加</text><circle class="hrem ring" cx="104" cy="116.6" r="9"/><polyline class="glyph" points="100,116.6 108,116.6"/><text x="120" y="120.6" class="ink" font-size="12" text-anchor="start" font-weight="400">削除（破線）</text><rect class="box" x="220" y="110.55023923444976" width="16" height="12" rx="3"/><text x="242" y="120.6" class="ink" font-size="12" text-anchor="start" font-weight="400">変更なし</text><text x="20" y="141.6" class="ink2" font-size="11" text-anchor="start" font-weight="400">DB への直接の読み出しは、なくなる。</text>
</svg>
