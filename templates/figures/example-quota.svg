<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 194" width="720" height="194" role="img" aria-labelledby="t d">
<title id="t">使用量の上限に対する割合（例）</title><desc id="d">例示用の架空の値。保存容量は 58 %で正常、同時接続数は 83 % で注意、月の費用は 96 % で危険、というメーターの読み方の例。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
