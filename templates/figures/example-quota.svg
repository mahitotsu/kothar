<text x="24" y="30" class="ink" font-size="13" text-anchor="start" font-weight="600">保存容量</text><text x="696" y="30" class="ink" font-size="12" text-anchor="end" font-weight="400">58 / 100 GB</text><rect class="track" x="24" y="40" width="672" height="10" rx="5"/><rect class="s1" x="24" y="40" width="389.8" height="10" rx="5"/><text x="24" y="82" class="ink" font-size="13" text-anchor="start" font-weight="600">同時接続数</text><text x="630" y="82" class="ink" font-size="12" text-anchor="end" font-weight="400">830 / 1000</text><polygon class="warn" points="640,70 649,85 631,85"/><text x="640" y="83" class="onfill" font-size="11" font-weight="700" text-anchor="middle">!</text><text x="696" y="82" class="ink" font-size="12" text-anchor="end" font-weight="600">注意</text><rect class="track" x="24" y="92" width="672" height="10" rx="5"/><rect class="warn" x="24" y="92" width="557.8" height="10" rx="5"/><text x="24" y="134" class="ink" font-size="13" text-anchor="start" font-weight="600">月の費用</text><text x="630" y="134" class="ink" font-size="12" text-anchor="end" font-weight="400">960 / 1000 USD</text><rect class="bad" x="632" y="122" width="16" height="16" rx="3"/><polyline class="glyph" points="636.5,126.5 643.5,133.5"/><polyline class="glyph" points="643.5,126.5 636.5,133.5"/><text x="696" y="134" class="ink" font-size="12" text-anchor="end" font-weight="600">危険</text><rect class="track" x="24" y="144" width="672" height="10" rx="5"/><rect class="bad" x="24" y="144" width="645.1" height="10" rx="5"/><text x="24" y="184" class="ink2" font-size="11" text-anchor="start" font-weight="400">値は例示用。注意と危険は、記号と文字でも示す。</text>
</svg>
