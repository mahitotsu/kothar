<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" role="img" aria-labelledby="t d">
<title id="t">施策の優先順位（例）</title><desc id="d">例示用。キャッシュの追加は、効果が大きく労力が小さい。DB の入れ替えは、効果が大きいが労力も大きい。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
